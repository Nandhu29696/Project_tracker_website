# Production stack:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Put TLS in front (Caddy / nginx + certbot / cloud load balancer) and set:
#   NODE_ENV=production, COOKIE_SECURE=true, TRUST_PROXY=1, APP_URL/CORS_ORIGIN/GOOGLE_CALLBACK_URL = https://your-domain
name: project-tracker-prod

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10
    # no ports published - only reachable inside the docker network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    image: project-tracker-api:latest
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
    volumes:
      - uploads:/app/apps/api/uploads # work item attachments - back this up
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    image: project-tracker-web:latest
    restart: always
    ports:
      - '${WEB_PORT:-80}:80'
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
